<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="portalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
    <linearGradient id="portalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="portalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cosmic Background Circle with border -->
  <circle cx="256" cy="256" r="236" fill="#090d16" stroke="url(#portalGrad1)" stroke-width="8" />

  <!-- Background Singularity Pulse -->
  <circle cx="256" cy="256" r="200" fill="url(#portalCore)" />

  <!-- Outer Swirling Vortex Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#portalGrad1)" stroke-width="12" stroke-linecap="round" stroke-dasharray="140 40 80 50" filter="url(#neonGlow)" transform="rotate(35 256 256)" />

  <!-- Secondary Counter-Rotating Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#portalGrad2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="110 50 60 40" opacity="0.85" filter="url(#neonGlow)" transform="rotate(-65 256 256)" />

  <!-- Inner High-Energy Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#67e8f9" stroke-width="5" stroke-dasharray="60 30 40 30" opacity="0.75" />

  <!-- Quantum Particle Nodes -->
  <circle cx="390" cy="190" r="8" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="120" cy="310" r="7" fill="#f72585" filter="url(#neonGlow)" />
  <circle cx="330" cy="380" r="6" fill="#a78bfa" filter="url(#neonGlow)" />
  <circle cx="170" cy="140" r="6" fill="#67e8f9" filter="url(#neonGlow)" />
  <circle cx="256" cy="70" r="5" fill="#ffffff" filter="url(#neonGlow)" />

  <!-- Chess King Silhouette with Crown -->
  <g filter="url(#portalGlow)">
    <!-- Base -->
    <path d="M176 395 C176 385 195 380 256 380 C317 380 336 385 336 395 L346 415 C348 420 344 425 338 425 L174 425 C168 425 164 420 166 415 Z" fill="url(#pieceGrad)" stroke="#38bdf8" stroke-width="4" />

    <!-- Pedestal / Ring -->
    <path d="M190 380 C190 368 206 362 256 362 C306 362 322 368 322 380 Z" fill="url(#pieceGrad)" />

    <!-- Body Pillar -->
    <path d="M202 362 C205 315 220 270 216 230 C216 210 226 195 256 195 C286 195 296 210 296 230 C292 270 307 315 310 362 Z" fill="url(#pieceGrad)" stroke="#38bdf8" stroke-width="4" />

    <!-- King's Cross on Top -->
    <!-- Cross vertical beam -->
    <rect x="249" y="105" width="14" height="42" rx="3" fill="#ffffff" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)" />
    <!-- Cross horizontal beam -->
    <rect x="238" y="118" width="36" height="14" rx="3" fill="#ffffff" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)" />

    <!-- Crown Flare Head -->
    <path d="M214 175 C214 150 238 145 256 145 C274 145 298 150 298 175 C298 190 286 200 256 200 C226 200 214 190 214 175 Z" fill="url(#pieceGrad)" stroke="#38bdf8" stroke-width="4" />

    <!-- Crown Radiating Gems -->
    <circle cx="226" cy="158" r="5" fill="#00f2fe" />
    <circle cx="256" cy="154" r="6" fill="#f72585" />
    <circle cx="286" cy="158" r="5" fill="#a78bfa" />
  </g>

  <!-- Core Quantum Teleportation Sparkle at Center of King -->
  <g transform="translate(256, 275)">
    <circle cx="0" cy="0" r="14" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <!-- 4-point star burst -->
    <path d="M0 -28 Q0 0 28 0 Q0 0 0 28 Q0 0 -28 0 Q0 0 0 -28 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
